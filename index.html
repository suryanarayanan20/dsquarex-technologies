<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Values in %…% are filled from src/data/site.js by vite.config.js
      (siteHtml plugin). Edit site.js, not this file.
    -->
    <link rel="canonical" href="%SITE_URL%/" />

    <title>%HOME_TITLE%</title>
    <meta name="description" content="%HOME_DESCRIPTION%" />
    <meta name="keywords" content="%KEYWORDS%" />
    <meta name="author" content="%SITE_NAME%" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="color-scheme" content="dark" />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%HOME_TITLE%" />
    <meta property="og:description" content="%HOME_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%%OG_IMAGE%" />
    <meta property="og:image:secure_url" content="%SITE_URL%%OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_URL%/" />
    <meta name="twitter:title" content="%HOME_TITLE%" />
    <meta name="twitter:description" content="%HOME_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <!-- ==================== FONTS ==================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- ==================== STRUCTURED DATA (JSON-LD, generated from site.js) ==================== -->
    <script type="application/ld+json" id="structured-data">%STRUCTURED_DATA%</script>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}
      (window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', '1715691742981395');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>

  <body>
    <!-- Meta Pixel (noscript) -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display:none"
        src="https://www.facebook.com/tr?id=1715691742981395&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
